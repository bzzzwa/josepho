<!doctype html>

<html lang="cs">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>Josepho - Kapitola 1: Svítání</title>
        <meta name="theme-color" content="#000000" />
        <!-- installable "app": opens without browser bars from the home screen (the only fullscreen on iPhone) -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/icon.svg" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Josepho" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }

            body {
                background: black;
                /* phones: no text selection, callouts, pull-to-refresh or double-tap zoom while playing */
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
                overscroll-behavior: none;
                touch-action: none;
            }

            #canvas-container {
                width: 100dvw;
                height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /*
             * Scale the pixel canvas up to fill the window while keeping its aspect ratio and staying crisp.
             * The engine sets the --canvas-* custom properties; the fallbacks here keep things sensible if it does not.
             */
            #canvas-container canvas {
                display: block;
                image-rendering: pixelated;
                width: min(
                    100dvw,
                    calc(100dvh * var(--canvas-aspect-w, 640) / var(--canvas-aspect-h, 480)),
                    var(--canvas-max-w, 1280px)
                );
                height: min(
                    100dvh,
                    calc(100dvw * var(--canvas-aspect-h, 480) / var(--canvas-aspect-w, 640)),
                    var(--canvas-max-h, 960px)
                );
            }

            @supports (image-rendering: crisp-edges) {
                #canvas-container canvas {
                    image-rendering: crisp-edges;
                }
            }
        </style>
    </head>

    <body>
        <div id="canvas-container"><canvas id="blit386-canvas"></canvas></div>
        <script type="module" src="/src/game.js"></script>
    </body>
</html>
